name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Python: lint + unit tests ───────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-ml.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # ── Frontend: install + build ───────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install and build
        run: |
          cd frontend
          npm install
          npm run build

  # ── Docker: build both images ───────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build sandbox worker image
        run: docker build -t sandbox-worker:latest ./docker/sandbox

      - name: Build backend API image
        run: docker build -t malsandbox-api:latest ./backend

      - name: Build ML worker image
        run: docker build -f backend/Dockerfile.ml -t malsandbox-ml-worker:latest backend/

      - name: Smoke test — docker compose up
        run: |
          cp .env.example .env
          docker compose up -d redis
          sleep 5
          docker compose up -d api ml-worker
          sleep 15
          curl --retry 5 --retry-delay 3 -f http://localhost:8000/health
